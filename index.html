    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (next) {
                currentFetch = next;
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var src = (event && event.filename) || '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0
            ) {
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
