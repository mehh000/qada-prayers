name: qada_tracker
description: A mindful, unhurried Qada prayer estimation and daily tracking Flutter Android app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/courtyard_peace_banner.jpg
    - assets/images/spiritual_renewal_hero.jpg
